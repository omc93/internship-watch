name: Internship watch

on:
  schedule:
    # The real checking is done by the continuous workflow (loop.yml). This schedule is
    # only a watchdog: whenever GitHub fires it, it restarts the continuous checker if
    # that has stopped. Running this workflow by hand still does one full check.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test notification only"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: internship-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Send test alert
        if: ${{ inputs.test_alert }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 watch.py --test

      - name: Keep the continuous checker alive
        id: gate
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          alive=$(gh run list --workflow loop.yml --limit 20 --json status \
            --jq '[.[] | select(.status != "completed")] | length')
          if [ "$alive" = "0" ]; then
            echo "Continuous checker is not running; starting it."
            gh workflow run loop.yml --ref main
          else
            echo "Continuous checker is running."
          fi
          echo "skip=true" >> "$GITHUB_OUTPUT"

      - name: Check companies
        if: ${{ !inputs.test_alert && steps.gate.outputs.skip != 'true' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HANDLED_IDS: ${{ secrets.HANDLED_IDS }}
          ALERT_MODE: ${{ vars.ALERT_MODE }}
        run: python3 watch.py

      - name: Save what was seen
        if: ${{ !inputs.test_alert && steps.gate.outputs.skip != 'true' }}
        run: |
          date +%s > state/last_run
          git config user.name "internship-watch"
          git config user.email "internship-watch@users.noreply.github.com"
          git add state STATUS.md
          git add ALERTS.md REVIEW.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -q -m "Update seen postings"
            git push -q || (git pull -q --rebase origin main && git push -q)
          fi
