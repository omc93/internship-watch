name: Internship watch

on:
  schedule:
    # GitHub often delays or drops scheduled runs, so ask four times an hour and
    # let the gate below skip any run that comes less than 50 minutes after the last check.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test notification only"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: internship-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Send test alert
        if: ${{ inputs.test_alert }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 watch.py --test

      - name: Skip if checked recently
        id: gate
        run: |
          last=$(cat state/last_run 2>/dev/null || echo 0)
          now=$(date +%s)
          if [ "${{ github.event_name }}" = "schedule" ] && [ $((now - last)) -lt 3000 ]; then
            echo "Checked $(( (now - last) / 60 )) minutes ago; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check companies
        if: ${{ !inputs.test_alert && steps.gate.outputs.skip != 'true' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HANDLED_IDS: ${{ secrets.HANDLED_IDS }}
          ALERT_MODE: ${{ vars.ALERT_MODE }}
        run: python3 watch.py

      - name: Save what was seen
        if: ${{ !inputs.test_alert && steps.gate.outputs.skip != 'true' }}
        run: |
          date +%s > state/last_run
          git config user.name "internship-watch"
          git config user.email "internship-watch@users.noreply.github.com"
          git add state STATUS.md
          git add ALERTS.md REVIEW.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -q -m "Update seen postings"
            git push
          fi
