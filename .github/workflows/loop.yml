name: Internship watch (continuous)

# GitHub's scheduler only fired a few times a day, so this workflow keeps itself going.
# Each run: one full check; then, if Workday refused some companies, up to two more
# passes over just those companies, each on a fresh machine (Workday's limit depends
# on the machine's network address); then it waits so that a cycle takes about 35
# minutes, and starts the next run. The scheduled "Internship watch" workflow restarts
# this one if it ever stops.
on:
  workflow_dispatch:
    inputs:
      streak:
        description: "Unused (kept so older restarts still work)"
        default: "0"

permissions:
  contents: write
  actions: write

concurrency:
  group: internship-loop
  cancel-in-progress: false

env:
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
  HANDLED_IDS: ${{ secrets.HANDLED_IDS }}
  ALERT_MODE: ${{ vars.ALERT_MODE }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      blocked: ${{ steps.run.outputs.blocked }}
      started: ${{ steps.run.outputs.started }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check all companies
        id: run
        run: |
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
          python3 watch.py || echo "This check failed."
          echo "blocked=$(cat .blocked_count 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"
          bash tools/commit_state.sh

  retry1:
    needs: check
    if: ${{ !cancelled() && needs.check.outputs.blocked != '0' && needs.check.outputs.blocked != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      blocked: ${{ steps.run.outputs.blocked }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Retry Workday-limited companies from a fresh machine
        id: run
        run: |
          python3 watch.py --retry-blocked || echo "This retry failed."
          echo "blocked=$(cat .blocked_count 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"
          bash tools/commit_state.sh

  retry2:
    needs: retry1
    if: ${{ !cancelled() && needs.retry1.result == 'success' && needs.retry1.outputs.blocked != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Retry Workday-limited companies from another fresh machine
        run: |
          python3 watch.py --retry-blocked || echo "This retry failed."
          bash tools/commit_state.sh

  next:
    needs: [check, retry1, retry2]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Wait, then start the next cycle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STARTED: ${{ needs.check.outputs.started }}
        run: |
          started=${STARTED:-$(date +%s)}
          wait=$(( 2100 - ($(date +%s) - started) ))
          [ "$wait" -lt 120 ] && wait=120
          echo "Next cycle in $wait seconds."
          sleep "$wait"
          for i in 1 2 3 4 5 6; do
            gh workflow run loop.yml --ref main && exit 0
            echo "Restart failed (attempt $i); trying again in 30 seconds."
            sleep 30
          done
          exit 1
